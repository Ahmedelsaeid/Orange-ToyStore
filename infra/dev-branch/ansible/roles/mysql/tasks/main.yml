---
- name: Require MySQL secrets
  ansible.builtin.assert:
    that:
      - mysql_root_password | length > 0
      - mysql_password | length > 0
    fail_msg: "Set MYSQL_ROOT_PASSWORD and MYSQL_PASSWORD as CI/CD variables or Ansible Vault values."
  no_log: true

- name: Verify Helm is available
  ansible.builtin.command: /home/gitlab-runner/.local/bin/helm version --short
  changed_when: false

- name: Deploy MySQL Dev via Helm
  ansible.builtin.command: >
    /home/gitlab-runner/.local/bin/helm upgrade --install mysql-dev {{ role_path }}/files/chart
    --namespace dev
    --set image={{ mysql_image }}
    --set storage.size={{ mysql_storage_size }}
    --set auth.database={{ mysql_database }}
    --set auth.username={{ mysql_user }}
    --set auth.rootPassword={{ mysql_root_password }}
    --set auth.password={{ mysql_password }}
  environment:
    KUBECONFIG: "/home/gitlab-runner/.kube/config"
  changed_when: true
  no_log: true

- name: Wait for Dev MySQL rollout
  ansible.builtin.command:
    argv: [/usr/local/bin/kubectl, -n, dev, rollout, status, deployment/mysql, --timeout=180s]
  environment:
    KUBECONFIG: "/home/gitlab-runner/.kube/config"
  changed_when: false
